<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias · Casa Eme</title>
<link rel="icon" href="favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,700;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f1e6 url(paper.jpg) center/cover fixed;color:#3b2b1e;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
main{max-width:520px;display:flex;flex-direction:column;align-items:center;gap:16px}
img{height:min(340px,46vh);width:auto}
h1{margin:0;font-family:Lora,Georgia,serif;font-size:40px}
p{margin:0;font-size:17px;line-height:26px;color:#6e5e4e}
a{display:inline-block;margin-top:8px;background:#3b2b1e;color:#f7f2e9;text-decoration:none;font-weight:600;padding:14px 24px;border-radius:8px}
</style>
</head>
<body>
<main>
  <img src="casa-eme-crest.png" alt="Casa Eme">
  <h1>¡Gracias!</h1>
  <p>We got your order. We'll reach out within a day to confirm the details and payment.</p>
  <a href="/">Back to Casa Eme</a>
</main>
<script>
try { localStorage.removeItem('casaEmeCart'); } catch (e) {}
try {
  if (localStorage.getItem('casaEmeLang') === 'es') {
    document.documentElement.lang = 'es';
    document.querySelector('main p').textContent = 'Recibimos tu pedido. Te contactaremos en un día para confirmar los detalles y el pago.';
    document.querySelector('main a').textContent = 'Volver a Casa Eme';
  }
} catch (e) {}
</script>
</body>
</html>
